name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run all tests
        run: go test ./...

      - name: Enforce 100% earnings coverage
        shell: bash
        run: |
          go test -coverprofile=earnings-coverage.out ./internal/earnings
          coverage="$(go tool cover -func=earnings-coverage.out | awk '/^total:/ {print $3}')"
          if [[ "$coverage" != "100.0%" ]]; then
            echo "Earnings coverage is $coverage; required coverage is 100.0%."
            exit 1
          fi

