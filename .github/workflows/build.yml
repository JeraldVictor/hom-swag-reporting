name: Build & Push Reporting Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to push (e.g. latest, v1.2.3)"
        required: false
        default: "latest"

env:
  REGISTRY: ghcr.io
  # repository_owner may contain uppercase characters; lowercase it in the build step.
  IMAGE_NAME: ${{ github.repository_owner }}/hom-swag-reporting

jobs:
  build-and-push:
    name: Build & push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify earnings coverage
        shell: bash
        run: |
          go test -coverprofile=earnings-coverage.out ./internal/earnings
          coverage="$(go tool cover -func=earnings-coverage.out | awk '/^total:/ {print $3}')"
          if [[ "$coverage" != "100.0%" ]]; then
            echo "Earnings coverage is $coverage; required coverage is 100.0%."
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image tags
        id: tags
        run: |
          INPUT_TAG="${{ github.event.inputs.tag }}"
          TAG="${INPUT_TAG:-latest}"
          OWNER="${{ github.repository_owner }}"
          OWNER_LOWER="${OWNER,,}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${{ env.REGISTRY }}/${OWNER_LOWER}/hom-swag-reporting" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.tag }}
            ${{ steps.tags.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
